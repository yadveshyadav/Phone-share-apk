<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Consent Capture Portal</title>
<style>
:root{font:16px system-ui;color:#182230;background:#f4f7fb}body{margin:0}.wrap{max-width:1100px;margin:40px auto;padding:0 20px}.head,.card{background:white;border:1px solid #dce4ee;border-radius:16px;padding:22px;box-shadow:0 8px 30px #152b4710}.head{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}h1{font-size:24px;margin:0 0 6px}.muted{color:#627084;font-size:14px}.controls{display:flex;gap:8px}input,button{font:inherit;padding:11px 13px;border:1px solid #ccd6e2;border-radius:10px}input{min-width:260px}button{cursor:pointer;background:#165dce;color:white;border:0;font-weight:600}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-top:20px}.tile{overflow:hidden;padding:10px}.tile img{display:block;width:100%;aspect-ratio:16/10;object-fit:contain;background:#eef2f7;border-radius:9px}.tile p{font-size:13px;color:#536174;margin:9px 2px 2px}.status{margin-top:14px;color:#627084;font-size:14px}
</style></head><body><main class="wrap"><section class="head"><div><h1>Consent Capture Portal</h1><div class="muted">Images uploaded by the visible desktop app appear here.</div></div><div class="controls"><input id="token" type="password" placeholder="Portal access token" autocomplete="off"><button id="load">Load images</button></div></section><div id="status" class="status">Enter the portal token to view authorized uploads.</div><section id="grid" class="grid"></section></main>
<script>
const token=document.querySelector('#token'),grid=document.querySelector('#grid'),status=document.querySelector('#status');token.value=sessionStorage.getItem('portalToken')||'';
async function load(){const t=token.value.trim();if(!t){status.textContent='Enter the portal token.';return}sessionStorage.setItem('portalToken',t);status.textContent='Loading…';grid.replaceChildren();try{const r=await fetch('/api/images',{headers:{Authorization:'Bearer '+t}});if(!r.ok)throw Error(r.status===401?'Token not accepted.':'Portal request failed ('+r.status+').');const list=await r.json();status.textContent=list.length?`${list.length} recent image${list.length===1?'':'s'}`:'No uploads yet.';for(const item of list){const card=document.createElement('article');card.className='card tile';const img=document.createElement('img');img.alt='User-submitted screenshot';const ir=await fetch(item.url,{headers:{Authorization:'Bearer '+t}});if(!ir.ok)continue;img.src=URL.createObjectURL(await ir.blob());const caption=document.createElement('p');caption.textContent=new Date(item.receivedAt+'Z').toLocaleString();card.append(img,caption);grid.append(card)}}catch(e){status.textContent=e.message}}
document.querySelector('#load').addEventListener('click',load);token.addEventListener('keydown',e=>{if(e.key==='Enter')load()});
</script></body></html>
